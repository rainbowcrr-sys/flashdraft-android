name: android-build

on:
  push:
    branches: [ main ]
    tags: [ 'v0.*' ]
  pull_request:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel for manual runs'
        required: false
        default: 'edge'
        type: choice
        options:
          - edge
          - nightly

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build
        run: dotnet build FlashDraft.Android.sln -c Release --verbosity minimal
      - name: Create a signing key for the installable APK
        run: |
          keytool -genkeypair -v -keystore flashdraft.keystore -alias flashdraft             -keyalg RSA -keysize 2048 -validity 10000             -storepass flashdraft -keypass flashdraft             -dname "CN=FlashDraft, O=FlashDraft, C=CN" 2>/dev/null
      - name: Publish signed APK
        run: |
          dotnet publish src/FlashDraft.Android/FlashDraft.Android.csproj -c Release             -f net10.0-android36.0 -o ./publish             -p:AndroidSigningKeyStore=$PWD/flashdraft.keystore             -p:AndroidSigningStorePass=flashdraft             -p:AndroidSigningKeyAlias=flashdraft             -p:AndroidSigningKeyPass=flashdraft
          APK=$(find ./publish -name '*Signed.apk' -print -quit)
          if [ -z "$APK" ]; then APK=$(find ./publish -name '*.apk' -print -quit); fi
          if [ -z "$APK" ]; then echo "::error::No APK was produced"; exit 1; fi
          cp "$APK" ./FlashDraft-Android.apk
          SIGNER=$(find "$ANDROID_HOME" -type f -name apksigner -print -quit 2>/dev/null || true)
          if [ -n "$SIGNER" ] && ! "$SIGNER" verify ./FlashDraft-Android.apk >/dev/null 2>&1; then
            "$SIGNER" sign --ks flashdraft.keystore --ks-pass pass:flashdraft               --key-pass pass:flashdraft --out ./FlashDraft-Android-signed.apk ./FlashDraft-Android.apk
            mv ./FlashDraft-Android-signed.apk ./FlashDraft-Android.apk
          fi
      - name: Verify APK launcher activity and icon
        shell: bash
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print -quit)
          if [ -z "$AAPT" ]; then echo "::warning::aapt2 not found; skipping APK inspection"; exit 0; fi
          "$AAPT" dump badging ./FlashDraft-Android.apk > apk-badging.txt
          head -12 apk-badging.txt
          grep -q "launchable-activity" apk-badging.txt || { echo "::error::No launcher activity in APK"; exit 1; }
          grep -q "MainActivity" apk-badging.txt || { echo "::error::MainActivity is not the launcher"; exit 1; }
          grep -qi "ic_launcher" apk-badging.txt || { echo "::error::Launcher icon missing"; exit 1; }
          echo "FD_APK_BADGING=OK"
      - name: Checksum
        run: sha256sum ./FlashDraft-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flashdraft-android
          if-no-files-found: error
          path: |
            ./FlashDraft-Android.apk
            ./SHA256SUMS.txt

  emulator-smoke:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flashdraft-android
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
      - name: Install and launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          script: |
            python3 "$GITHUB_WORKSPACE/packaging/smoke.py"

      - name: Emit phone frame part 1
        if: always()
        shell: bash
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("phone-b64.txt"); b=p.read_text() if p.exists() else ""; c=[b[i:i+3000] for i in range(0,len(b),3000)]; [print("::warning::FD_PHONE:%d:%s"%(i,x)) for i,x in enumerate(c[0:7],start=0)]'

      - name: Emit phone frame part 2
        if: always()
        shell: bash
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("phone-b64.txt"); b=p.read_text() if p.exists() else ""; c=[b[i:i+3000] for i in range(0,len(b),3000)]; [print("::warning::FD_PHONE:%d:%s"%(i,x)) for i,x in enumerate(c[7:14],start=7)]'

      - name: Emit phone frame part 3
        if: always()
        shell: bash
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("phone-b64.txt"); b=p.read_text() if p.exists() else ""; c=[b[i:i+3000] for i in range(0,len(b),3000)]; [print("::warning::FD_PHONE:%d:%s"%(i,x)) for i,x in enumerate(c[14:21],start=14)]'

      - name: Emit phone frame part 4
        if: always()
        shell: bash
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("phone-b64.txt"); b=p.read_text() if p.exists() else ""; c=[b[i:i+3000] for i in range(0,len(b),3000)]; [print("::warning::FD_PHONE:%d:%s"%(i,x)) for i,x in enumerate(c[21:28],start=21)]'

      - name: Emit phone frame part 5
        if: always()
        shell: bash
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("phone-b64.txt"); b=p.read_text() if p.exists() else ""; c=[b[i:i+3000] for i in range(0,len(b),3000)]; [print("::warning::FD_PHONE:%d:%s"%(i,x)) for i,x in enumerate(c[28:35],start=28)]'

      - name: Emit phone frame part 6
        if: always()
        shell: bash
        run: |
          python3 -c 'import pathlib; p=pathlib.Path("phone-b64.txt"); b=p.read_text() if p.exists() else ""; c=[b[i:i+3000] for i in range(0,len(b),3000)]; [print("::warning::FD_PHONE:%d:%s"%(i,x)) for i,x in enumerate(c[35:42],start=35)]'

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flashdraft-*
          path: dist
          merge-multiple: true
      - name: Publish build artifacts to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          set +o pipefail
          {
          set -eu
          mapfile -t FILES < <(find dist -type f -print)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No build artifacts were downloaded"
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="FlashDraft ${TAG}"
            NOTES="Stable release ${TAG}. All packages are unsigned; verify SHA256SUMS before use."
            PRERELEASE=0
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${{ inputs.channel }}" == "nightly" ]]; then
            TAG="nightly"
            TITLE="Nightly build $(date -u +%F)"
            NOTES="Automated nightly build. Unsigned and unverified; use at your own risk."
            PRERELEASE=1
          else
            TAG="edge"
            TITLE="Edge build"
            NOTES="Rolling build from the main branch. Unsigned and unverified."
            PRERELEASE=1
          fi
          ARGS=()
          if [[ "$PRERELEASE" == "1" ]]; then ARGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove stale assets so nightly/edge releases never accumulate old files.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes >/dev/null 2>&1 || true
            done
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${ARGS[@]}" --title "$TITLE" --notes "$NOTES" "${FILES[@]}"
          fi
          echo "Published ${#FILES[@]} file(s) to release $TAG"
          } > release.log 2>&1
          status=$?
          cat release.log
          if [ "$status" -ne 0 ]; then
            tail -30 release.log | while IFS= read -r line; do echo "::error::$line"; done
            exit "$status"
          fi
