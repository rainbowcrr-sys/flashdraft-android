name: android-build

on:
  push:
    branches: [ main ]
    tags: [ 'v0.*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Build
        run: dotnet build FlashDraft.Android.sln -c Release
      - name: Publish unsigned APK
        run: dotnet publish src/FlashDraft.Android/FlashDraft.Android.csproj -c Release -f net10.0-android26.0 -o ./publish
      # The APK stays unsigned at zero cost and is shipped with a SHA-256 sum.
      - name: Checksum
        run: sha256sum ./publish/*.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flashdraft-android
          path: |
            ./publish/*.apk
            ./SHA256SUMS.txt
